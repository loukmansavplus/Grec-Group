name: Déploiement Firebase

# (Désactivé) À chaque push sur main : publiait le site, les règles et les index Firestore.
# Déploiement automatique DÉSACTIVÉ (28 octobre 2026) : le site est publié à la main par FTP chez OVH.
# Pour le réactiver, remettre le bloc « push » ci-dessous (et renseigner le secret FIREBASE_SERVICE_ACCOUNT du projet).
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authentification (compte de service)
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"

      - name: Déploiement
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@latest deploy --only hosting,firestore --project grec-group-f43b0 --non-interactive

      - name: Nettoyage
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
